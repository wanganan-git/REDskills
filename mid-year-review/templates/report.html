<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026年上半年个人复盘报告</title>
<style>
/* ========== FONTS ========== */
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

/* ========== RESET ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }

/* ========== VARIABLES ========== */
:root {
  --primary: #1a3a3a;
  --primary-light: #2a5a5a;
  --accent: #c8956c;
  --accent-light: #e8c5a8;
  --bg: #f5f2ed;
  --bg-card: #ffffff;
  --text: #2c2c2c;
  --text-light: #6b6b6b;
  --text-muted: #999999;
  --border: #e0ddd8;
  --success: #4a8c6f;
  --warning: #c8956c;
  --danger: #b85c5c;
  --radius: 12px;
  --shadow: 0 2px 20px rgba(0,0,0,0.06);
  --font-serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
  --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

/* ========== APP SHELL ========== */
#app {
  width: 100vw; height: 100vh;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

/* ========== SLIDES ========== */
.slides-wrapper {
  display: flex;
  width: 100%; height: 100%;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}
.slide {
  min-width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 60px 80px;
  position: relative;
  flex-shrink: 0;
}
.slide-inner {
  width: 100%; max-width: 1200px;
  height: 100%;
  display: flex; flex-direction: column;
  justify-content: center;
}

/* ========== NAVIGATION ========== */
.nav-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 40px;
  background: rgba(245,242,237,0.9);
  backdrop-filter: blur(10px);
  z-index: 100;
  border-top: 1px solid var(--border);
}
.nav-dots {
  display: flex; gap: 8px; align-items: center;
}
.nav-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border);
  cursor: pointer;
  transition: all 0.3s;
  border: none;
  padding: 0;
}
.nav-dot.active {
  background: var(--primary);
  width: 24px;
  border-radius: 4px;
}
.nav-dot:hover { background: var(--primary-light); }
.nav-info {
  font-size: 13px;
  color: var(--text-muted);
  font-family: var(--font-sans);
  letter-spacing: 1px;
}
.nav-btn {
  background: none; border: none;
  cursor: pointer; padding: 8px;
  color: var(--text-light);
  transition: color 0.2s;
  font-size: 18px;
}
.nav-btn:hover { color: var(--primary); }
.nav-btn:disabled { opacity: 0.3; cursor: default; }

/* ========== COVER PAGE ========== */
.cover { background: var(--primary); }
.cover .slide-inner {
  justify-content: center;
  align-items: center;
  text-align: center;
}
.cover-label {
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--accent-light);
  margin-bottom: 32px;
}
.cover-title {
  font-family: var(--font-serif);
  font-size: 56px;
  font-weight: 900;
  color: #ffffff;
  line-height: 1.3;
  margin-bottom: 24px;
}
.cover-subtitle {
  font-family: var(--font-sans);
  font-size: 18px;
  color: rgba(255,255,255,0.6);
  font-weight: 300;
  margin-bottom: 48px;
}
.cover-meta {
  display: flex; gap: 32px;
  font-size: 13px;
  color: rgba(255,255,255,0.4);
  letter-spacing: 1px;
}
.cover-divider {
  width: 60px; height: 2px;
  background: var(--accent);
  margin: 0 auto 32px;
}

/* ========== OVERVIEW PAGE ========== */
.overview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  margin-top: 40px;
}
.stat-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 28px 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--accent);
}
.stat-label {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 500;
  letter-spacing: 1px;
  margin-bottom: 12px;
}
.stat-value {
  font-family: var(--font-serif);
  font-size: 42px;
  font-weight: 900;
  color: var(--primary);
  line-height: 1;
  margin-bottom: 8px;
}
.stat-note {
  font-size: 13px;
  color: var(--text-light);
  line-height: 1.6;
}

/* ========== SECTION TITLE ========== */
.section-header {
  margin-bottom: 40px;
}
.section-number {
  font-family: var(--font-serif);
  font-size: 72px;
  font-weight: 900;
  color: var(--border);
  line-height: 1;
  margin-bottom: 8px;
}
.section-title {
  font-family: var(--font-serif);
  font-size: 36px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 8px;
}
.section-subtitle {
  font-size: 15px;
  color: var(--text-muted);
  font-weight: 300;
}

/* ========== DIMENSION PAGE ========== */
.dimension-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  margin-top: 24px;
  flex: 1;
  min-height: 0;
}
.dim-left, .dim-right {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.dim-block {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.dim-block-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.dim-block-title .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  display: inline-block;
}
.dot-green { background: var(--success); }
.dot-amber { background: var(--warning); }
.dot-red { background: var(--danger); }

.dim-text {
  font-size: 15px;
  line-height: 1.8;
  color: var(--text);
}

/* Completion ring */
.completion-ring-wrapper {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 20px;
}
.completion-ring {
  width: 80px; height: 80px;
  position: relative;
  flex-shrink: 0;
}
.completion-ring svg {
  transform: rotate(-90deg);
}
.completion-ring-bg {
  fill: none;
  stroke: var(--border);
  stroke-width: 6;
}
.completion-ring-fill {
  fill: none;
  stroke: var(--accent);
  stroke-width: 6;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s ease;
}
.completion-ring-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
}
.completion-label {
  font-size: 14px;
  color: var(--text-light);
}

/* Action lists */
.action-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.action-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
}
.action-tag {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  flex-shrink: 0;
  margin-top: 2px;
  letter-spacing: 1px;
}
.tag-continue { background: rgba(74,140,111,0.12); color: var(--success); }
.tag-stop { background: rgba(184,92,92,0.12); color: var(--danger); }
.tag-start { background: rgba(200,149,108,0.12); color: var(--warning); }

/* ========== FINDINGS PAGE ========== */
.findings-grid {
  display: flex;
  flex-direction: column;
  gap: 24px;
  margin-top: 40px;
}
.finding-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 32px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  display: flex;
  gap: 24px;
  align-items: flex-start;
}
.finding-num {
  font-family: var(--font-serif);
  font-size: 48px;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
  flex-shrink: 0;
  opacity: 0.6;
}
.finding-content {
  flex: 1;
}
.finding-title {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 8px;
}
.finding-desc {
  font-size: 14px;
  line-height: 1.8;
  color: var(--text-light);
}

/* ========== ACTION PLAN PAGE ========== */
.action-table {
  width: 100%;
  margin-top: 32px;
  border-collapse: separate;
  border-spacing: 0;
  background: var(--bg-card);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.action-table th {
  background: var(--primary);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 16px 20px;
  text-align: left;
}
.action-table td {
  padding: 16px 20px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.action-table tr:last-child td { border-bottom: none; }
.action-table tr:hover td { background: rgba(200,149,108,0.04); }

/* ========== CLOSING PAGE ========== */
.closing { background: var(--primary); }
.closing .slide-inner {
  justify-content: center;
  align-items: center;
  text-align: center;
}
.closing-quote {
  font-family: var(--font-serif);
  font-size: 36px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.6;
  max-width: 700px;
  position: relative;
}
.closing-quote::before {
  content: '"';
  font-size: 120px;
  color: var(--accent);
  opacity: 0.3;
  position: absolute;
  top: -40px; left: -20px;
  font-family: var(--font-serif);
}
.closing-date {
  margin-top: 40px;
  font-size: 13px;
  color: rgba(255,255,255,0.4);
  letter-spacing: 2px;
}

/* ========== ANIMATIONS ========== */
.fade-in {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.fade-in.visible {
  opacity: 1;
  transform: translateY(0);
}
.fade-in-delay-1 { transition-delay: 0.1s; }
.fade-in-delay-2 { transition-delay: 0.2s; }
.fade-in-delay-3 { transition-delay: 0.3s; }
.fade-in-delay-4 { transition-delay: 0.4s; }

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  .slide { padding: 30px 24px; }
  .cover-title { font-size: 32px; }
  .section-number { font-size: 48px; }
  .section-title { font-size: 24px; }
  .dimension-layout { grid-template-columns: 1fr; gap: 16px; }
  .overview-grid { grid-template-columns: 1fr 1fr; }
  .stat-value { font-size: 28px; }
  .finding-card { flex-direction: column; gap: 12px; }
  .nav-bar { padding: 12px 20px; }
}

/* ========== PRINT ========== */
@media print {
  .nav-bar { display: none; }
  .slides-wrapper { flex-direction: column; transform: none !important; }
  .slide { min-width: auto; height: auto; page-break-after: always; padding: 40px; }
}
</style>
</head>
<body>

<div id="app">
  <div class="slides-wrapper" id="slidesWrapper">
    <!-- Pages will be generated by JS -->
  </div>
  <nav class="nav-bar" id="navBar">
    <button class="nav-btn" id="prevBtn" onclick="goTo(currentPage-1)">&#8592;</button>
    <div class="nav-dots" id="navDots"></div>
    <div class="nav-info" id="navInfo">1 / 1</div>
    <button class="nav-btn" id="nextBtn" onclick="goTo(currentPage+1)">&#8594;</button>

</div>

<script>

// ============================================================
// RENDER ENGINE
// ============================================================
let currentPage = 0;
let totalPages = 0;

function createSlides() {
  const wrapper = document.getElementById('slidesWrapper');
  const dots = document.getElementById('navDots');
  let html = '';
  let dotHtml = '';
  let pageIdx = 0;

  // P1: Cover
  html += `
    <div class="slide cover" data-page="${pageIdx}">
      <div class="slide-inner">
        <div class="cover-label fade-in">PERSONAL REVIEW</div>
        <div class="cover-title fade-in fade-in-delay-1">2026年上半年<br>个人复盘报告</div>
        <div class="cover-divider fade-in fade-in-delay-2"></div>
        <div class="cover-subtitle fade-in fade-in-delay-2">${DATA.meta.system}</div>
        <div class="cover-meta fade-in fade-in-delay-3">
          <span>${DATA.meta.date}</span>
          <span>${DATA.meta.range}</span>
        </div>
      </div>
    </div>`;
  dotHtml += `<button class="nav-dot active" onclick="goTo(${pageIdx})"></button>`;
  pageIdx++;

  // P2: Overview
  const statsHtml = DATA.overview.stats.map((s, i) => `
    <div class="stat-card fade-in fade-in-delay-${i+1}">
      <div class="stat-label">${s.label}</div>
      <div class="stat-value">${s.value}</div>
      <div class="stat-note">${s.note}</div>
    </div>
  `).join('');
  html += `
    <div class="slide" data-page="${pageIdx}">
      <div class="slide-inner">
        <div class="section-header">
          <div class="section-number fade-in">00</div>
          <div class="section-title fade-in fade-in-delay-1">上半年总览</div>
          <div class="section-subtitle fade-in fade-in-delay-2">${DATA.overview.summary}</div>
        </div>
        <div class="overview-grid">${statsHtml}</div>
      </div>
    </div>`;
  dotHtml += `<button class="nav-dot" onclick="goTo(${pageIdx})"></button>`;
  pageIdx++;

  // P3-P6: Dimensions
  const numMap = ['01','02','03','04','05','06'];
  DATA.dimensions.forEach((dim, i) => {
    const num = numMap[i] || String(i+1).padStart(2,'0');
    const circ = 2 * Math.PI * 34;
    const offset = circ * (1 - dim.completion / 100);

    const continueHtml = dim.continue.map(item =>
      `<li class="action-item"><span class="action-tag tag-continue">继续</span><span>${item}</span></li>`
    ).join('');
    const stopHtml = dim.stop.map(item =>
      `<li class="action-item"><span class="action-tag tag-stop">停止</span><span>${item}</span></li>`
    ).join('');
    const startHtml = dim.start.map(item =>
      `<li class="action-item"><span class="action-tag tag-start">开始</span><span>${item}</span></li>`
    ).join('');

    html += `
    <div class="slide" data-page="${pageIdx}">
      <div class="slide-inner">
        <div class="section-header">
          <div class="section-number fade-in">${num}</div>
          <div class="section-title fade-in fade-in-delay-1">${dim.title}</div>
          <div class="section-subtitle fade-in fade-in-delay-2">${dim.subtitle}</div>
        </div>
        <div class="dimension-layout">
          <div class="dim-left">
            <div class="dim-block fade-in fade-in-delay-1">

                <div class="completion-ring">
                  <svg width="80" height="80" viewBox="0 0 80 80">
                    <circle class="completion-ring-bg" cx="40" cy="40" r="34"/>
                    <circle class="completion-ring-fill" cx="40" cy="40" r="34"
                      stroke-dasharray="${circ}"
                      stroke-dashoffset="${offset}"
                      data-target="${offset}"/>
                  </svg>
                  <div class="completion-ring-text">${dim.completion}%</div>
                </div>
                <div class="completion-label">完成度评估</div>
              </div>
              <div class="dim-block-title"><span class="dot dot-amber"></span> 目标</div>
              <div class="dim-text">${dim.goal}</div>
            </div>
            <div class="dim-block fade-in fade-in-delay-2">
              <div class="dim-block-title"><span class="dot dot-green"></span> 实际情况</div>
              <div class="dim-text">${dim.reality}</div>
            </div>
          </div>
          <div class="dim-right">
            <div class="dim-block fade-in fade-in-delay-2">
              <div class="dim-block-title"><span class="dot dot-green"></span> 继续做</div>
              <ul class="action-list">${continueHtml}</ul>
            </div>
            <div class="dim-block fade-in fade-in-delay-3">
              <div class="dim-block-title"><span class="dot dot-red"></span> 停止做</div>
              <ul class="action-list">${stopHtml}</ul>
            </div>
            <div class="dim-block fade-in fade-in-delay-4">
              <div class="dim-block-title"><span class="dot dot-amber"></span> 开始做</div>
              <ul class="action-list">${startHtml}</ul>
            </div>
          </div>
        </div>
      </div>
    </div>`;
    dotHtml += `<button class="nav-dot" onclick="goTo(${pageIdx})"></button>`;
    pageIdx++;
  });

  // Findings page
  const findingsHtml = DATA.findings.map((f, i) => `
    <div class="finding-card fade-in fade-in-delay-${i+1}">
      <div class="finding-num">${String(i+1).padStart(2,'0')}</div>
      <div class="finding-content">
        <div class="finding-title">${f.title}</div>
        <div class="finding-desc">${f.desc}</div>
      </div>
    </div>
  `).join('');
  html += `
    <div class="slide" data-page="${pageIdx}">
      <div class="slide-inner">
        <div class="section-header">
          <div class="section-number fade-in">K</div>
          <div class="section-title fade-in fade-in-delay-1">关键发现</div>
          <div class="section-subtitle fade-in fade-in-delay-2">上半年最重要的认知升级</div>
        </div>
        <div class="findings-grid">${findingsHtml}</div>
      </div>
    </div>`;
  dotHtml += `<button class="nav-dot" onclick="goTo(${pageIdx})"></button>`;
  pageIdx++;

  // Action plan page
  const actionRowsHtml = DATA.actions.map(a => `
    <tr>
      <td>${a.content}</td>
      <td>${a.deadline}</td>
      <td>${a.criteria}</td>
    </tr>
  `).join('');
  html += `
    <div class="slide" data-page="${pageIdx}">
      <div class="slide-inner">
        <div class="section-header">
          <div class="section-number fade-in">P</div>
          <div class="section-title fade-in fade-in-delay-1">下半年行动计划</div>
          <div class="section-subtitle fade-in fade-in-delay-2">每个行动都有明确的验收标准</div>
        </div>
        <table class="action-table fade-in fade-in-delay-2">
          <thead>
            <tr>
              <th>行动内容</th>
              <th>截止时间</th>
              <th>验收标准</th>
            </tr>
          </thead>
          <tbody>${actionRowsHtml}</tbody>
        </table>
      </div>
    </div>`;
  dotHtml += `<button class="nav-dot" onclick="goTo(${pageIdx})"></button>`;
  pageIdx++;

  // Closing page
  html += `
    <div class="slide closing" data-page="${pageIdx}">
      <div class="slide-inner">
        <div class="closing-quote fade-in">${DATA.closing}</div>
        <div class="closing-date fade-in fade-in-delay-2">${DATA.meta.date} · 年中复盘</div>
      </div>
    </div>`;
  dotHtml += `<button class="nav-dot" onclick="goTo(${pageIdx})"></button>`;
  pageIdx++;

  wrapper.innerHTML = html;
  dots.innerHTML = dotHtml;
  totalPages = pageIdx;
}

// ============================================================
// NAVIGATION
// ============================================================
function goTo(page) {
  if (page < 0 || page >= totalPages) return;
  currentPage = page;
  const wrapper = document.getElementById('slidesWrapper');
  wrapper.style.transform = `translateX(-${page * 100}vw)`;

  // Update dots
  document.querySelectorAll('.nav-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === page);
  });

  // Update info
  document.getElementById('navInfo').textContent = `${page + 1} / ${totalPages}`;
  document.getElementById('prevBtn').disabled = page === 0;
  document.getElementById('nextBtn').disabled = page === totalPages - 1;

  // Trigger fade-in animations
  setTimeout(() => {
    const currentSlide = document.querySelector(`.slide[data-page="${page}"]`);
    if (currentSlide) {
      currentSlide.querySelectorAll('.fade-in').forEach(el => {
        el.classList.add('visible');
      });
    }
  }, 100);
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault();
    goTo(currentPage + 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    goTo(currentPage - 1);
  }
});

// Touch/swipe support
let touchStartX = 0;
let touchEndX = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
});
document.addEventListener('touchend', (e) => {
  touchEndX = e.changedTouches[0].screenX;
  const diff = touchStartX - touchEndX;
  if (Math.abs(diff) > 50) {
    if (diff > 0) goTo(currentPage + 1);
    else goTo(currentPage - 1);
  }
});

// ============================================================
// INIT
// ============================================================
createSlides();
goTo(0);
</script>

</body>
